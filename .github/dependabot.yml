version: 2
updates:
  - package-ecosystem: "npm"
    directories:
      - "/"
      - "/apps/comment-lens"
      - "/apps/wesnest-search"
      - "/proposal-email"
    schedule:
      interval: "weekly"
    groups:
      npm:
        patterns:
          - "*"
  - package-ecosystem: "pip"
    directory: "/apps/comment-lens/scanner"
    schedule:
      interval: "weekly"
  - package-ecosystem: "pip"
    directory: "/apps/piano-tool/backend"
    schedule:
      interval: "weekly"
  - package-ecosystem: "pub"
    directory: "/apps/piano-tool"
    schedule:
      interval: "weekly"
  - package-ecosystem: "gradle"
    directory: "/apps/piano-tool/android"
    schedule:
      interval: "weekly"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      actions:
        patterns:
          - "*"
