name: CI

on:
  push:
    branches: [ "main", "staging" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets:
    name: Secret scan
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITLEAKS_NOTIFY_USER_LIST: ""
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  wesnest:
    name: WesNest Search
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
    - uses: actions/checkout@v7
    - name: Set up pnpm and Node.js
      uses: pnpm/action-setup@v6
    - name: Set up Node.js
      uses: actions/setup-node@v7
      with:
        node-version-file: .node-version
        cache: pnpm
    - name: Install dependencies
      run: pnpm install --frozen-lockfile
    - name: Syntax and lint check
      run: |
        node --check apps/wesnest-search/lib/*.mjs
        node --check apps/wesnest-search/scripts/*.mjs
        node --check apps/wesnest-search/api/search.js
    - name: Run unit tests with 100% coverage gate
      run: pnpm --filter wesnest-search test:coverage

  proposal_email:
    name: Proposal Email
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@v7
    - name: Set up pnpm and Node.js
      uses: pnpm/action-setup@v6
    - name: Set up Node.js
      uses: actions/setup-node@v7
      with:
        node-version-file: .node-version
        cache: pnpm
    - name: Install dependencies
      run: pnpm install --frozen-lockfile
    - name: Type check
      run: pnpm --filter proposal-email typecheck

  comment_lens:
    name: Comment Lens
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
    - uses: actions/checkout@v7
    - name: Set up pnpm and Node.js
      uses: pnpm/action-setup@v6
    - name: Set up Node.js
      uses: actions/setup-node@v7
      with:
        node-version-file: .node-version
        cache: pnpm
    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: "3.12"
        cache: pip
        cache-dependency-path: apps/comment-lens/scanner/pyproject.toml
    - name: Install JavaScript dependencies
      run: pnpm install --frozen-lockfile
    - name: Install scanner dependencies
      run: python -m pip install --disable-pip-version-check -e apps/comment-lens/scanner pytest pytest-cov
    - name: Type check
      run: pnpm --filter comment-lens typecheck
    - name: Lint
      run: pnpm --filter comment-lens lint
    - name: Run JavaScript tests with coverage gate
      run: pnpm --filter comment-lens test:coverage
    - name: Run scanner tests with 100% coverage gate
      run: python -m pytest --cov=comment_lens_scanner --cov-report=term-missing --cov-fail-under=100 apps/comment-lens/scanner
    - name: Validate scanner contract schema
      run: python -m json.tool apps/comment-lens/contracts/schema.json >/dev/null
    - name: Run integration and security tests
      run: pnpm --filter comment-lens test -- --test-name-pattern='boundary|auth|control-plane|Gemini|performance'
    - name: Build production application
      run: pnpm --filter comment-lens build
    - name: Install Playwright browser
      run: pnpm --filter comment-lens exec playwright install --with-deps chromium
    - name: Run end-to-end tests
      run: pnpm --filter comment-lens test:e2e
    - name: Upload Comment Lens test artifacts
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: comment-lens-test-results-${{ github.run_id }}
        path: |
          apps/comment-lens/test-results
          apps/comment-lens/playwright-report
        if-no-files-found: ignore
        retention-days: 7
  postgres_integration:
    name: Comment Lens Postgres integration
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    needs: [comment_lens]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: comment_lens
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d comment_lens"
          --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply database migrations before tests
        run: pnpm --filter comment-lens db:migrate
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/comment_lens
      - name: Run Postgres integration tests
        run: pnpm --filter comment-lens test -- --test-name-pattern='database|data|migration'
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/comment_lens
      - name: Upload Postgres integration artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: postgres-integration-${{ github.run_id }}
          path: apps/comment-lens/test-results
          if-no-files-found: ignore
          retention-days: 7

  performance:
    name: Comment Lens performance
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    needs: [comment_lens]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: comment_lens
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d comment_lens"
          --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply database migrations before benchmark
        run: pnpm --filter comment-lens db:migrate
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/comment_lens
      - name: Run performance tests
        run: pnpm --filter comment-lens test:performance
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/comment_lens
      - name: Upload performance artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: comment-lens-performance-${{ github.run_id }}
          path: apps/comment-lens/tests/performance/artifacts/large-comments.json
          if-no-files-found: error
          retention-days: 7

  worker:
    name: Comment Lens worker
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    needs: [comment_lens]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install worker dependencies
        run: python -m pip install --disable-pip-version-check -e apps/comment-lens/scanner pytest
      - name: Run worker tests
        run: python -m pytest apps/comment-lens/scanner apps/comment-lens/worker
      - name: Upload worker artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: comment-lens-worker-${{ github.run_id }}
          path: apps/comment-lens/test-results
          if-no-files-found: ignore
          retention-days: 7

  piano_tool_flutter:
    name: Piano Tool Flutter (analyze, format, test)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: apps/piano-tool
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: 'stable'
          cache: true
      - name: Get dependencies
        run: flutter pub get
      - name: Analyze
        run: flutter analyze --no-fatal-infos
      - name: Check format
        run: dart format --output=none --set-exit-if-changed .
      - name: Run tests with coverage
        run: flutter test --coverage

  piano_tool_python:
    name: Piano Tool Python (ruff, black, mypy, pytest)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: apps/piano-tool
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements.txt
          bash backend/scripts/install_basic_pitch.sh
      - name: Install lint tools
        run: python -m pip install ruff black mypy pytest-cov
      - name: Ruff lint
        run: python -m ruff check backend
      - name: Black format check
        run: python -m black --check backend
      - name: Mypy type check
        run: python -m mypy --config-file backend/pyproject.toml backend/app --strict --ignore-missing-imports
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Run pytest with 100% coverage gate
        run: python -m pytest -W error -W ignore::UserWarning -W ignore::starlette.exceptions.StarletteDeprecationWarning -W "ignore:The anyio.abc.BlockingPortal alias is deprecated:DeprecationWarning" --cov=app --cov-report=term-missing --cov-fail-under=100 backend

  summary:
    name: CI summary
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    if: always()
    needs: [secrets, wesnest, proposal_email, comment_lens, postgres_integration, performance, worker, piano_tool_flutter, piano_tool_python]
    steps:
    - name: Check all jobs passed
      run: |
        if [[ "${{ needs.secrets.result }}" != "success" ]] || [[ "${{ needs.wesnest.result }}" != "success" ]] || [[ "${{ needs.proposal_email.result }}" != "success" ]] || [[ "${{ needs.comment_lens.result }}" != "success" ]] || [[ "${{ needs.postgres_integration.result }}" != "success" ]] || [[ "${{ needs.performance.result }}" != "success" ]] || [[ "${{ needs.worker.result }}" != "success" ]] || [[ "${{ needs.piano_tool_flutter.result }}" != "success" ]] || [[ "${{ needs.piano_tool_python.result }}" != "success" ]]; then
          echo "One or more CI checks failed"
          exit 1
        fi
        echo "All CI checks passed"

  deploy:
    name: Deploy to Vercel
    needs: [summary]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/staging')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Trigger Vercel Deploy Hook
        env:
          VERCEL_DEPLOY_HOOK_PROD: ${{ secrets.VERCEL_DEPLOY_HOOK_PROD }}
          VERCEL_DEPLOY_HOOK_STAGING: ${{ secrets.VERCEL_DEPLOY_HOOK_STAGING }}
        run: |
          if [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
            echo "Deploying to production..."
            curl -sS -f -X POST "$VERCEL_DEPLOY_HOOK_PROD"
          elif [[ "${{ github.ref }}" == "refs/heads/staging" ]]; then
            echo "Deploying to staging..."
            curl -sS -f -X POST "$VERCEL_DEPLOY_HOOK_STAGING"
          fi
