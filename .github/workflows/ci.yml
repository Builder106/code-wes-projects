name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets:
    name: Secret scan
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e
        env:
          GITLEAKS_NOTIFY_USER_LIST: ""

  wesnest:
    name: WesNest Search
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
    - name: Set up pnpm and Node.js
      uses: pnpm/setup@703c52620218391530e48b9e8870d5c0082e1b9b
      with:
        runtime: node@26
        cache: true
        install: false
    - name: Install dependencies
      run: pnpm install --frozen-lockfile
    - name: Syntax and lint check
      run: |
        node --check apps/wesnest-search/lib/*.mjs
        node --check apps/wesnest-search/scripts/*.mjs
        node --check apps/wesnest-search/api/search.js
    - name: Run unit tests
      run: pnpm --filter wesnest-search test

  proposal_email:
    name: Proposal Email
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
    - name: Set up pnpm and Node.js
      uses: pnpm/setup@703c52620218391530e48b9e8870d5c0082e1b9b
      with:
        runtime: node@26
        cache: true
        install: false
    - name: Install dependencies
      run: pnpm install --frozen-lockfile
    - name: Type check
      run: pnpm --filter proposal-email typecheck

  comment_lens:
    name: Comment Lens
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
    - name: Set up pnpm and Node.js
      uses: pnpm/setup@703c52620218391530e48b9e8870d5c0082e1b9b
      with:
        runtime: node@26
        cache: true
        install: false
    - name: Set up Python
      uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
      with:
        python-version: "3.12"
        cache: pip
        cache-dependency-path: apps/comment-lens/scanner/pyproject.toml
    - name: Install JavaScript dependencies
      run: pnpm install --frozen-lockfile
    - name: Install scanner dependencies
      run: python -m pip install --disable-pip-version-check -e apps/comment-lens/scanner
    - name: Type check
      run: pnpm --filter comment-lens typecheck
    - name: Lint
      run: pnpm --filter comment-lens lint
    - name: Run JavaScript tests
      run: pnpm --filter comment-lens test
    - name: Run scanner tests
      run: python -m pytest apps/comment-lens/scanner
    - name: Validate scanner contract schema
      run: python -m json.tool apps/comment-lens/contracts/schema.json >/dev/null
    - name: Run integration and security tests
      run: pnpm --filter comment-lens test -- --test-name-pattern='boundary|auth|control-plane|Gemini|performance'
    - name: Build production application
      run: pnpm --filter comment-lens build
    - name: Install Playwright browser
      run: pnpm --filter comment-lens exec playwright install --with-deps chromium
    - name: Run end-to-end tests
      run: pnpm --filter comment-lens test:e2e
  summary:
    name: JavaScript checks summary
    runs-on: ubuntu-24.04
    if: always()
    needs: [secrets, wesnest, proposal_email, comment_lens]
    steps:
    - name: Check all jobs passed
      run: |
        if [[ "${{ needs.secrets.result }}" != "success" ]] || [[ "${{ needs.wesnest.result }}" != "success" ]] || [[ "${{ needs.proposal_email.result }}" != "success" ]] || [[ "${{ needs.comment_lens.result }}" != "success" ]]; then
          echo "One or more JavaScript checks failed"
          exit 1
        fi
        echo "All JavaScript checks passed"
