name: CI

on:
  push:
    branches: [ "main", "staging" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets:
    name: Secret scan
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITLEAKS_NOTIFY_USER_LIST: ""
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  wesnest:
    name: WesNest Search
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
    - uses: actions/checkout@v7
    - name: Set up pnpm and Node.js
      uses: pnpm/action-setup@v6
    - name: Set up Node.js
      uses: actions/setup-node@v7
      with:
        node-version-file: .node-version
        cache: pnpm
    - name: Install dependencies
      run: pnpm install --frozen-lockfile
    - name: Syntax and lint check
      run: |
        node --check apps/wesnest-search/lib/*.mjs
        node --check apps/wesnest-search/scripts/*.mjs
        node --check apps/wesnest-search/api/search.js
    - name: Run unit tests with 100% coverage gate
      run: pnpm --filter wesnest-search test:coverage

  proposal_email:
    name: Proposal Email
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@v7
    - name: Set up pnpm and Node.js
      uses: pnpm/action-setup@v6
    - name: Set up Node.js
      uses: actions/setup-node@v7
      with:
        node-version-file: .node-version
        cache: pnpm
    - name: Install dependencies
      run: pnpm install --frozen-lockfile
    - name: Type check
      run: pnpm --filter proposal-email typecheck

  summary:
    name: CI summary
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    if: always()
    needs: [secrets, wesnest, proposal_email]
    steps:
    - name: Check all jobs passed
      run: |
        if [[ "${{ needs.secrets.result }}" != "success" ]] || [[ "${{ needs.wesnest.result }}" != "success" ]] || [[ "${{ needs.proposal_email.result }}" != "success" ]]; then
          echo "One or more CI checks failed"
          exit 1
        fi
        echo "All CI checks passed"

  deploy:
    name: Deploy to Vercel
    needs: [summary]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/staging')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Trigger Vercel Deploy Hook
        env:
          VERCEL_DEPLOY_HOOK_PROD: ${{ secrets.VERCEL_DEPLOY_HOOK_PROD }}
          VERCEL_DEPLOY_HOOK_STAGING: ${{ secrets.VERCEL_DEPLOY_HOOK_STAGING }}
        run: |
          if [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
            echo "Deploying to production..."
            curl -sS -f -X POST "$VERCEL_DEPLOY_HOOK_PROD"
          elif [[ "${{ github.ref }}" == "refs/heads/staging" ]]; then
            echo "Deploying to staging..."
            curl -sS -f -X POST "$VERCEL_DEPLOY_HOOK_STAGING"
          fi
