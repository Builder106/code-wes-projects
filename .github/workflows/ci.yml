name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets:
    name: Secret scan
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITLEAKS_NOTIFY_USER_LIST: ""

  wesnest:
    name: WesNest Search
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v7
    - uses: pnpm/action-setup@v4
    - name: Use Node.js
      uses: actions/setup-node@v7
      with:
        node-version-file: .node-version
        cache: pnpm
        cache-dependency-path: pnpm-lock.yaml
    - name: Install dependencies
      run: pnpm install --frozen-lockfile
    - name: Syntax and lint check
      run: |
        node --check apps/wesnest-search/lib/*.mjs
        node --check apps/wesnest-search/scripts/*.mjs
        node --check apps/wesnest-search/api/search.js
    - name: Run unit tests
      run: pnpm --filter wesnest-search test

  proposal_email:
    name: Proposal Email
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v7
    - uses: pnpm/action-setup@v4
    - name: Use Node.js
      uses: actions/setup-node@v7
      with:
        node-version-file: .node-version
        cache: pnpm
        cache-dependency-path: pnpm-lock.yaml
    - name: Install dependencies
      run: pnpm install --frozen-lockfile
    - name: Type check
      run: pnpm --filter proposal-email typecheck

  summary:
    name: JavaScript checks summary
    runs-on: ubuntu-24.04
    if: always()
    needs: [secrets, wesnest, proposal_email]
    steps:
    - name: Check all jobs passed
      run: |
        if [[ "${{ needs.secrets.result }}" != "success" ]] || [[ "${{ needs.wesnest.result }}" != "success" ]] || [[ "${{ needs.proposal_email.result }}" != "success" ]]; then
          echo "One or more JavaScript checks failed"
          exit 1
        fi
        echo "All JavaScript checks passed"
