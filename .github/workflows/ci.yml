name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets:
    name: Secret scan
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITLEAKS_NOTIFY_USER_LIST: ""
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  wesnest:
    name: WesNest Search
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
    - uses: actions/checkout@v7
    - name: Set up pnpm and Node.js
      uses: pnpm/action-setup@v6
    - name: Set up Node.js
      uses: actions/setup-node@v7
      with:
        node-version-file: .node-version
        cache: pnpm
    - name: Install dependencies
      run: pnpm install --frozen-lockfile
    - name: Syntax and lint check
      run: |
        node --check apps/wesnest-search/lib/*.mjs
        node --check apps/wesnest-search/scripts/*.mjs
        node --check apps/wesnest-search/api/search.js
    - name: Run unit tests with 100% coverage gate
      run: pnpm --filter wesnest-search test:coverage

  proposal_email:
    name: Proposal Email
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@v7
    - name: Set up pnpm and Node.js
      uses: pnpm/action-setup@v6
    - name: Set up Node.js
      uses: actions/setup-node@v7
      with:
        node-version-file: .node-version
        cache: pnpm
    - name: Install dependencies
      run: pnpm install --frozen-lockfile
    - name: Type check
      run: pnpm --filter proposal-email typecheck

  comment_lens:
    name: Comment Lens
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
    - uses: actions/checkout@v7
    - name: Set up pnpm and Node.js
      uses: pnpm/action-setup@v6
    - name: Set up Node.js
      uses: actions/setup-node@v7
      with:
        node-version-file: .node-version
        cache: pnpm
    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: "3.12"
        cache: pip
        cache-dependency-path: apps/comment-lens/scanner/pyproject.toml
    - name: Install JavaScript dependencies
      run: pnpm install --frozen-lockfile
    - name: Install scanner dependencies
      run: python -m pip install --disable-pip-version-check -e apps/comment-lens/scanner pytest pytest-cov
    - name: Type check
      run: pnpm --filter comment-lens typecheck
    - name: Lint
      run: pnpm --filter comment-lens lint
    - name: Run JavaScript tests with coverage gate
      run: pnpm --filter comment-lens test:coverage
    - name: Run scanner tests with 100% coverage gate
      run: python -m pytest --cov=comment_lens_scanner --cov-report=term-missing --cov-fail-under=100 apps/comment-lens/scanner
    - name: Validate scanner contract schema
      run: python -m json.tool apps/comment-lens/contracts/schema.json >/dev/null
    - name: Run integration and security tests
      run: pnpm --filter comment-lens test -- --test-name-pattern='boundary|auth|control-plane|Gemini|performance'
    - name: Build production application
      run: pnpm --filter comment-lens build
    - name: Install Playwright browser
      run: pnpm --filter comment-lens exec playwright install --with-deps chromium
    - name: Run end-to-end tests
      run: pnpm --filter comment-lens test:e2e
    - name: Upload Comment Lens test artifacts
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: comment-lens-test-results-${{ github.run_id }}
        path: |
          apps/comment-lens/test-results
          apps/comment-lens/playwright-report
        if-no-files-found: ignore
        retention-days: 7
  postgres_integration:
    name: Comment Lens Postgres integration
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    needs: [comment_lens]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: comment_lens
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d comment_lens"
          --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply database migrations before tests
        run: pnpm --filter comment-lens db:migrate
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/comment_lens
      - name: Run Postgres integration tests
        run: pnpm --filter comment-lens test -- --test-name-pattern='database|data|migration'
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/comment_lens
      - name: Upload Postgres integration artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: postgres-integration-${{ github.run_id }}
          path: apps/comment-lens/test-results
          if-no-files-found: ignore
          retention-days: 7

  performance:
    name: Comment Lens performance
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    needs: [comment_lens]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: comment_lens
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d comment_lens"
          --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply database migrations before benchmark
        run: pnpm --filter comment-lens db:migrate
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/comment_lens
      - name: Run performance tests
        run: pnpm --filter comment-lens test:performance
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/comment_lens
      - name: Upload performance artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: comment-lens-performance-${{ github.run_id }}
          path: apps/comment-lens/tests/performance/artifacts/large-comments.json
          if-no-files-found: error
          retention-days: 7

  worker:
    name: Comment Lens worker
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    needs: [comment_lens]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install worker dependencies
        run: python -m pip install --disable-pip-version-check -e apps/comment-lens/scanner pytest
      - name: Run worker tests
        run: python -m pytest apps/comment-lens/scanner apps/comment-lens/worker
      - name: Upload worker artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: comment-lens-worker-${{ github.run_id }}
          path: apps/comment-lens/test-results
          if-no-files-found: ignore
          retention-days: 7

  summary:
    name: JavaScript checks summary
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    if: always()
    needs: [secrets, wesnest, proposal_email, comment_lens, postgres_integration, performance, worker]
    steps:
    - name: Check all jobs passed
      run: |
        if [[ "${{ needs.secrets.result }}" != "success" ]] || [[ "${{ needs.wesnest.result }}" != "success" ]] || [[ "${{ needs.proposal_email.result }}" != "success" ]] || [[ "${{ needs.comment_lens.result }}" != "success" ]] || [[ "${{ needs.postgres_integration.result }}" != "success" ]] || [[ "${{ needs.performance.result }}" != "success" ]] || [[ "${{ needs.worker.result }}" != "success" ]]; then
          echo "One or more CI checks failed"
          exit 1
        fi
        echo "All CI checks passed"
