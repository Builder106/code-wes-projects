name: Piano Tool CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: piano-tool-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  flutter:
    name: Flutter (analyze, format, test)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: apps/piano-tool
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: '3.47.2'
          channel: 'stable'
          cache: true
      - name: Get dependencies
        run: flutter pub get
      - name: Analyze
        run: flutter analyze --no-fatal-infos
      - name: Check format
        run: dart format --output=none --set-exit-if-changed .
      - name: Run tests with coverage
        run: flutter test --coverage

  python:
    name: Python (ruff, black, mypy, pytest)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: apps/piano-tool
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements.txt
          bash backend/scripts/install_basic_pitch.sh
      - name: Install lint tools
        run: python -m pip install ruff black mypy pytest-cov
      - name: Ruff lint
        run: python -m ruff check backend
      - name: Black format check
        run: python -m black --check backend
      - name: Mypy type check
        run: python -m mypy --config-file backend/pyproject.toml backend/app --strict --ignore-missing-imports
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Run pytest with 100% coverage gate
        run: python -m pytest -W error -W ignore::UserWarning:pkg_resources -W ignore::starlette.exceptions.StarletteDeprecationWarning --cov=app --cov-report=term-missing --cov-fail-under=100 backend

  summary:
    name: Summary
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    needs: [flutter, python]
    if: always()
    steps:
      - name: Check all jobs passed
        run: |
          if [[ "${{ needs.flutter.result }}" != "success" ]] || [[ "${{ needs.python.result }}" != "success" ]]; then
            echo "One or more jobs failed"
            exit 1
          fi
          echo "All checks passed"
