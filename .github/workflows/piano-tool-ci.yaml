name: Piano Tool CI

on:
  push:
    branches: [main]
    paths:
      - 'apps/piano-tool/**'
  pull_request:
    branches: [main]
    paths:
      - 'apps/piano-tool/**'

jobs:
  flutter:
    name: Flutter (analyze, format, test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/piano-tool
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.0'
          channel: 'stable'
          cache: true
      - name: Get dependencies
        run: flutter pub get
      - name: Analyze
        run: flutter analyze --no-fatal-infos
      - name: Check format
        run: dart format --output=none --set-exit-if-changed .
      - name: Run tests
        run: flutter test

  python:
    name: Python (ruff, black, mypy, pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/piano-tool
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
      - name: Install lint tools
        run: pip install ruff black mypy
      - name: Ruff lint
        run: python -m ruff check backend
      - name: Black format check
        run: python -m black --check backend
      - name: Mypy type check
        run: python -m mypy --config-file backend/pyproject.toml backend/app --strict --ignore-missing-imports
      - name: Run pytest
        run: python -m pytest backend

  summary:
    name: Summary
    runs-on: ubuntu-latest
    needs: [flutter, python]
    if: always()
    steps:
      - name: Check all jobs passed
        run: |
          if [[ "${{ needs.flutter.result }}" != "success" ]] || [[ "${{ needs.python.result }}" != "success" ]]; then
            echo "One or more jobs failed"
            exit 1
          fi
          echo "All checks passed"